# Lumiverb's own nginx: lumiverb-server run starts it (-p DATA_DIR/nginx).
daemon off;
error_log stderr;
pid nginx.pid;
worker_processes 1;

events {
    worker_connections 256;
}

http {
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        application/wasm wasm;
        text/plain txt;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/gif gif;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
    }
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    server {
        include /usr/local/var/lumiverb/nginx/listen.conf;
        server_name _;

        root /opt/homebrew/opt/lumiverb/libexec/src/ui/web/dist;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        # Playback: a multi-GB proxy streams straight through instead of being
        # spooled to disk, and the link (a bearer token good for hours) stays
        # out of the access log. Range requests pass through as they are.
        location /v1/stream/ {
            proxy_pass http://127.0.0.1:6364;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            access_log off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:6364;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100m;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Built files carry a content hash in their name: cache them for good.
        # A location's add_header drops the server's, so they are repeated.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer-when-downgrade always;
        }

        # The page names the build's files, so the browser checks it every time
        # (the SPA fallback below ends here too).
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer-when-downgrade always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
