# Local development stack.
# Starts PostgreSQL (control plane + tenant DB host). Search is in it too (ADR-019).
# The API server and workers run outside Docker during development (uv run).
#
# Usage:
#   docker compose up -d          # start infrastructure
#   docker compose down           # stop (data persisted in volumes)
#   docker compose down -v        # stop AND wipe all data

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: lumiverb-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: control_plane
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker.
      # A pg16 stack's volume (postgres_data) is left alone; to bring its data
      # over, see "Moving the dev database to Postgres 18" in docs/linux-server.md.
      - postgres18_data:/var/lib/postgresql
      - ./scripts/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/docker/02-pg-hba.sh:/docker-entrypoint-initdb.d/02-pg-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d control_plane"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres18_data:
