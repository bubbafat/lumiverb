<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
    <title>Lumiverb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="signin" hidden>
        <h1>Lumiverb</h1>
        <form id="signin-form">
            <label>Server <input id="server" placeholder="http://media" required></label>
            <label>Email <input id="email" type="email" autocomplete="username" required></label>
            <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
            <button type="submit" id="signin-button">Sign in</button>
            <p class="status" id="signin-status" role="status"></p>
        </form>
    </section>

    <section id="search" hidden>
        <header>
            <span id="who"></span>
            <button type="button" class="link" id="signout">Sign out</button>
        </header>
        <form id="search-form">
            <input id="query" type="search" placeholder="Search" required>
            <button type="submit">Search</button>
        </form>
        <div class="options">
            <select id="project" aria-label="Project"></select>
            <div class="segmented" role="radiogroup" aria-label="Search">
                <label><input type="radio" name="scope" value="all" checked><span>All</span></label>
                <label><input type="radio" name="scope" value="in"><span>In project</span></label>
                <label><input type="radio" name="scope" value="out"><span>Not in project</span></label>
            </div>
        </div>
        <div class="options">
            <select id="media" aria-label="Type">
                <option value="video" selected>Video</option>
                <option value="image">Images</option>
                <option value="all">All</option>
            </select>
            <label class="check" id="also-add-label"><input type="checkbox" id="also-add" checked> Also add to project</label>
        </div>
        <p class="busy" id="busy" hidden><span class="spinner" aria-hidden="true"></span><span id="busy-text"></span></p>
        <ol id="results"></ol>
        <nav id="pager" hidden>
            <button type="button" id="prev">Previous</button>
            <span id="page"></span>
            <button type="button" id="next">Next</button>
        </nav>
        <p class="status" id="status" role="status"></p>
    </section>

    <script src="renderer.js"></script>
</body>
</html>
