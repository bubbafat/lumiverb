[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiverb"
version = "0.1.0"
description = "AI-powered photo and video library management"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

# Base dependencies: API server + shared core (what the VPS needs)
dependencies = [
    # API & web framework
    # Not fastapi[standard]: it brings OpenTelemetry's exporter, and Lumiverb
    # sends nothing anywhere. What the server uses of it is listed here.
    "fastapi>=0.143",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    # Database
    "sqlmodel>=0.0.14",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3.0",
    # Auth
    "pyjwt>=2.15",
    "bcrypt>=4.0",
    # Search
    "PyYAML>=6.0",
    # Shared utilities
    "python-ulid>=2.0",
    "requests>=2.33",
    # Image normalization (proxy → WebP, thumbnail generation)
    "pillow>=12.3.0",
    "scikit-learn>=1.3",
    "cryptography>=50.0.2",
]

[project.scripts]
lumiverb = "src.client.cli:main"
# The server's processing service (src/server/scheduler).
lumiverb-scheduler = "src.server.scheduler.service:entry"
# Look after a server on its own machine: migrations, and on a Mac its service (src/server/lifecycle).
lumiverb-server = "src.server.lifecycle.cli:entry"

[project.optional-dependencies]
# CLI: local agent that talks to the API
cli = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]
# Embeddings: server-side CLIP for /v1/similar/search-by-image. The
# server installs this on top of the cli extra so iOS clients can
# upload an arbitrary image and have the server embed it. Workers
# (which already need torch + open-clip for indexing) inherit it.
embeddings = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",  # named so it comes from torch's index too (tool.uv.sources)
    "open-clip-torch>=3.3.0",
]
# Face recognition: server-side InsightFace (detection + ArcFace
# embedding) used by the hybrid similarity search to find photos that
# match by *identity* in addition to scene similarity. Without this
# extra, search-by-image falls back to scene-only ranking. Workers
# already pull insightface in via the worker bundle, so this extra is
# only needed by the server-only install path.
#
# onnxruntime vs onnxruntime-gpu: both install the same `onnxruntime`
# module, so exactly one is selected per platform (here and in workers).
# The GPU build still ships the CPU provider, so CPU-only Linux hosts
# keep working — InsightFaceProvider only requests CUDA when a GPU is
# actually present. <1.27 because 1.27+ links CUDA 13, while the torch
# Linux x86_64 installs (PyTorch's CUDA 12.6 builds: tool.uv.sources) ships
# the CUDA 12 libs that ORT loads at runtime; raise the cap only together
# with a torch CUDA 13 build.
face_recognition = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "onnxruntime-gpu>=1.21.0,<1.27; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.8.0",
]
# Workers: image/video processing and AI (runs on the client machine).
# Includes embeddings so the indexing path has CLIP available.
workers = [
    "lumiverb[embeddings]",
    "rawpy>=0.26.1",
    "pyvips>=3.1.1",
    "imagehash>=4.3.0",
    "opencv-python-headless>=4.8.0",
    "pyexiftool>=0.5",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "onnxruntime-gpu>=1.21.0,<1.27; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "faster-whisper>=1.0.0",
]
# All extras: CLI + workers (for local development and client installs)
all = [
    "lumiverb[cli]",
    "lumiverb[workers]",
]
dev = [
    "lumiverb[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-order>=1.0",
    "pytest-xdist>=3.8.0",
    "testcontainers[postgres]>=4.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "opentimelineio>=0.18.1",
    "otio-fcp-adapter>=1.0.0",
    "otio-fcpx-xml-adapter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# =============================================================================
# uv
# =============================================================================
[tool.uv]
# faster-whisper depends on plain `onnxruntime` (Silero VAD). On Linux x86_64
# that would install it alongside onnxruntime-gpu, and the two overwrite each
# other's `onnxruntime` module. Drop it there; onnxruntime-gpu provides it.
override-dependencies = [
    "onnxruntime>=1.17.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

# torch on Linux x86_64 comes from PyTorch's CUDA 12.6 builds: PyPI's are
# CUDA 13 since 2.13, while onnxruntime-gpu (<1.27, above) and Whisper's
# CTranslate2 load CUDA 12's libraries, which torch's wheels bring. Move all
# three to CUDA 13 together, on a host whose NVIDIA driver runs it (580+).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "fast: no DB, no AI — pure unit tests, mocks, tmp_path only",
    "slow: requires DB (testcontainers Postgres)",
    "ai: requires real AI inference (Moondream Station running)",
    "migration: Alembic migration tests (run separately)",
]
# Default: run fast and slow tests; exclude AI and migration suites
addopts = ["-m", "not migration and not ai"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# =============================================================================
# Ruff (linter + formatter)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100

# Run with the machine's python3, 3.9 or later: Lumiverb's own plug-ins, and what the tests run under it.
[tool.ruff.per-file-target-version]
"src/own_plugins/**" = "py39"
"tests/plugins/geonames_lists.py" = "py39"
"tests/plugins/geonames_ask.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
